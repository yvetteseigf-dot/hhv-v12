name: build
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unzip
        run: |
          mkdir proj
          unzip -o "$(ls *.zip | head -1)" -d proj
      - name: Build
        run: |
          D=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$D" && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: |
            proj/**/build/libs/*.jar
            !proj/**/build/libs/*-sources.jar
